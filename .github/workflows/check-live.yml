name: Public site HTTP checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:production
      - name: Check normal HTTPS, redirects, and HTML SEO
        run: node check-live.mjs
      - name: Upload actual HTTP report and expected build manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-http-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/deployment/live-check-remote.json
            artifacts/seo-production/build-manifest.json
          if-no-files-found: warn
          retention-days: 14
